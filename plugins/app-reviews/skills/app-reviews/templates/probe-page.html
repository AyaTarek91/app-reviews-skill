<!doctype html>
<meta charset="utf-8">
<title>Area probe — what we searched for and what we found</title>
<style>
  :root {
    --ink: #17181c; --dim: #6b7280; --line: #e3e5e9; --bg: #fbfbfc; --card: #fff;
    --bad: #b4232b; --mid: #a16207; --good: #157347; --accent: #1c4ed8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 20px 80px; background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           padding: 14px 16px; margin-bottom: 18px; }
  .stats { display: flex; flex-wrap: wrap; gap: 26px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--dim); }
  .warn { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
          background: #fff8e6; border: 1px solid #f0dca8; color: #6b4b06; }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; font-size: 13px; }
  button { font: inherit; padding: 5px 11px; border: 1px solid var(--line); background: #fff;
           border-radius: 7px; cursor: pointer; color: var(--ink); }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .area { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          margin-bottom: 10px; overflow: hidden; }
  .area.empty { border-style: dashed; background: #fdfdfd; }
  .head { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 18px;
          align-items: center; padding: 13px 16px; cursor: pointer; }
  .head:hover { background: #f7f8fa; }
  .nm { font-weight: 600; }
  .nm small { display: block; font-weight: 400; color: var(--dim); font-size: 12px;
              margin-top: 2px; max-width: 60ch; }
  .metric { text-align: right; font-variant-numeric: tabular-nums; min-width: 62px; }
  .metric b { display: block; font-size: 16px; }
  .metric span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .zero { color: var(--dim); font-style: italic; font-size: 13px; }
  .body { display: none; padding: 4px 16px 18px; border-top: 1px solid var(--line); }
  .area.open .body { display: block; }
  .split { display: flex; gap: 18px; margin: 12px 0; font-size: 13px; }
  .split div { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; flex: 1; }
  .split b { font-size: 17px; display: block; font-variant-numeric: tabular-nums; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
       margin: 18px 0 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--dim); font-size: 11px;
       text-transform: uppercase; letter-spacing: .04em; padding: 5px 8px; }
  td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; width: 60px; }
  tr.dead td { color: var(--bad); }
  .term { font-family: ui-monospace, Consolas, monospace; }
  .q { border-left: 3px solid var(--line); padding: 5px 0 5px 11px; margin: 7px 0;
       font-size: 13px; color: #33363d; }
  .q .meta { font-size: 11px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; }
  .ar { direction: rtl; text-align: right; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
  .spark i { background: var(--accent); opacity: .55; width: 11px; border-radius: 1px 1px 0 0; }
  .r1 { color: var(--bad); } .r3 { color: var(--mid); } .r5 { color: var(--good); }
</style>

<div class="wrap">
  <h1>Area probe</h1>
  <div class="sub" id="sub"></div>

  <div class="panel">
    <div class="stats" id="stats"></div>
    <div class="warn" id="warn"></div>
  </div>

  <div class="controls">
    <span style="color:var(--dim)">Sort</span>
    <button data-sort="n" class="on">Most found</button>
    <button data-sort="avg">Angriest</button>
    <button data-sort="name">A–Z</button>
    <span style="flex:1"></span>
    <button id="expand">Expand all</button>
  </div>

  <div id="areas"></div>
</div>

<script>
const DATA = /*__DATA__*/null;

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isAr = s => /[؀-ۿ]/.test(s);
const pct = v => v === null ? '—' : Math.round(100 * v) + '%';
const rClass = r => r <= 2 ? 'r1' : r <= 3 ? 'r3' : 'r5';

document.getElementById('sub').textContent =
  `${DATA.source} · areas from ${DATA.areaFile} · built ${DATA.generated.slice(0, 10)}`;

const c = DATA.coverage;
document.getElementById('stats').innerHTML = [
  [c.substantive.toLocaleString(), 'substantive reviews'],
  [c.matched.toLocaleString(), 'matched an area'],
  [c.unmatched.toLocaleString(), 'matched nothing'],
  [DATA.areas.filter(a => a.n === 0).length, 'areas found nothing'],
].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');

document.getElementById('warn').innerHTML =
  `<b>Read the matched words before trusting a number.</b> ${c.overlapping.toLocaleString()} reviews ` +
  `matched more than one area, so these counts overlap and must not be added together. ` +
  `A count is only as good as the words that produced it — open an area and check that its ` +
  `top search words mean what you assumed they mean.`;

function sparkline(months) {
  if (!months.length) return '';
  const max = Math.max(...months.map(m => m.count));
  return `<div class="spark">${months.map(m =>
    `<i style="height:${Math.max(2, Math.round(24 * m.count / max))}px" title="${m.month}: ${m.count}"></i>`).join('')}</div>`;
}

function samples(list) {
  return list.map(s => `<div class="q">
      <div class="meta">${'★'.repeat(s.rating)}${'·'.repeat(5 - s.rating)} · ${s.store} · ${s.version ?? 'no version'} · ${s.date}</div>
      <div class="${isAr(s.text) ? 'ar' : ''}">${esc(s.text)}</div>
    </div>`).join('');
}

function render(list) {
  document.getElementById('areas').innerHTML = list.map((a, i) => {
    const v = a.versions;
    return `<div class="area ${a.n === 0 ? 'empty' : ''}" data-i="${i}">
      <div class="head">
        <div class="nm">${esc(a.name)}${a.note ? `<small>${esc(a.note)}</small>` : ''}</div>
        ${a.n === 0
          ? `<div class="zero" style="grid-column:2/6">searched ${a.terms.length} words · found nothing</div>`
          : `<div class="metric"><b>${a.n.toLocaleString()}</b><span>found</span></div>
             <div class="metric"><b>${(100 * a.share).toFixed(1)}%</b><span>of subst.</span></div>
             <div class="metric"><b class="${rClass(a.avg)}">${a.avg.toFixed(2)}</b><span>score</span></div>
             <div class="metric"><b>${pct(a.oneStar)}</b><span>1 star</span></div>`}
      </div>
      <div class="body">
        ${a.n === 0 ? `<p class="zero">Nothing matched. That is a result: either this area genuinely
           does not come up in reviews, or the search words below are not the words your customers use.
           Check the words before concluding the first.</p>` : ''}
        ${v && a.n ? `<h3>Before vs after ${esc(v.splitVersion)}</h3><div class="split">
            <div>on an older build<b class="${v.before.avg ? rClass(v.before.avg) : ''}">${v.before.avg ?? '—'}</b>
              ${v.before.n} reviews · ${pct(v.before.oneStar)} one star</div>
            <div>on ${esc(v.splitVersion)} or later<b class="${v.after.avg ? rClass(v.after.avg) : ''}">${v.after.avg ?? '—'}</b>
              ${v.after.n} reviews · ${pct(v.after.oneStar)} one star</div>
          </div>` : ''}
        ${a.months.length ? `<h3>By month</h3>${sparkline(a.months)}` : ''}
        <h3>Search words, and what each one found</h3>
        <table><thead><tr><th>word</th><th class="n">hits</th><th>examples — check these mean what you expect</th></tr></thead>
        <tbody>${a.terms.map(t => `<tr class="${t.hits === 0 ? 'dead' : ''}">
            <td class="term ${isAr(t.term) ? 'ar' : ''}">${esc(t.term)}</td>
            <td class="n">${t.hits}${t.excluded ? `<br><span style="font-size:10px;color:var(--dim)">−${t.excluded}</span>` : ''}</td>
            <td>${t.hits === 0
              ? '<span class="zero">no matches — likely the wrong word rather than an absent topic</span>'
              : samples(t.samples)}</td>
          </tr>`).join('')}</tbody></table>
        ${a.samples.length ? `<h3>Longest examples in this area</h3>${samples(a.samples)}` : ''}
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.head').forEach(h =>
    h.addEventListener('click', () => h.parentElement.classList.toggle('open')));
}

let sorted = DATA.areas.slice();
const sorters = {
  n: (a, b) => b.n - a.n,
  avg: (a, b) => (a.avg ?? 9) - (b.avg ?? 9) || b.n - a.n,
  name: (a, b) => a.name.localeCompare(b.name),
};
document.querySelectorAll('[data-sort]').forEach(btn =>
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    sorted = DATA.areas.slice().sort(sorters[btn.dataset.sort]);
    render(sorted);
  }));

document.getElementById('expand').addEventListener('click', e => {
  const open = document.querySelectorAll('.area.open').length < DATA.areas.length;
  document.querySelectorAll('.area').forEach(a => a.classList.toggle('open', open));
  e.target.textContent = open ? 'Collapse all' : 'Expand all';
});

render(sorted.sort(sorters.n));
</script>
